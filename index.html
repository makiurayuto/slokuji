<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5a0812">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="スロくじ">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>スロくじ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <div class="flash" id="flash"></div>
    <div class="tapcatch" id="tapcatch" aria-label="タップして閉じる"></div>

    <div class="dialog" id="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle" aria-describedby="dlgBody" hidden>
      <div class="dialog-box">
        <h2 class="dlg-title" id="dlgTitle"></h2>
        <div class="dlg-body" id="dlgBody"></div>
        <div class="dlg-actions" id="dlgActions"></div>
      </div>
    </div>

    <main class="cabinet" id="cabinet">
      <div class="sidelamps l" id="lampsL"></div>
      <div class="sidelamps r" id="lampsR"></div>

      <header class="topper">
        <div class="lamps t" id="lampsT"></div>
        <div class="offline" id="offline" data-state="wait" role="status" aria-live="polite"><i></i><span>準備中</span></div>
        <h1 class="title">スロくじ</h1>
        <div class="lamps b" id="lampsB"></div>
      </header>

      <section class="reelbox" id="reelbox" aria-label="スロット">
        <div class="marks" id="marksL"></div>
        <div class="reels" id="reels">
          <div class="reel"><div class="drum"></div></div>
          <div class="reel"><div class="drum"></div></div>
          <div class="reel"><div class="drum"></div></div>
          <svg class="overlay" id="overlay" aria-hidden="true"></svg>
          <div class="glass"></div>
        </div>
        <div class="marks" id="marksR"></div>
        <div class="burst" id="burst" aria-live="assertive"><div class="rays"></div><div class="label" id="burstLabel"></div></div>
      </section>

      <div class="msg" id="msg" role="status" aria-live="polite">準備中…</div>

      <div class="deck">
        <button class="smallbtn" id="sound" type="button"><span class="ic">🔇</span>音OFF</button>
        <button class="start" id="start" type="button" aria-label="スタート" disabled><span class="dome">START</span></button>
        <button class="smallbtn" id="reset" type="button"><span class="ic">↺</span>リセット</button>
      </div>

      <div class="tray">
        <details>
          <summary id="histsum">履歴（0件）</summary>
          <ul class="hist" id="hist"></ul>
        </details>
      </div>

      <div class="speedsel" role="group" aria-label="止まる速さ">
        <span class="lbl">速さ</span>
        <div class="seg">
          <button type="button" data-speed="slow">遅い</button><button type="button" data-speed="normal">普通</button><button type="button" data-speed="fast">速い</button>
        </div>
      </div>
    </main>
  </div>
  <noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
</body>
</html>
